<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartQueue – Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../CSS/base.css" />
    <link rel="stylesheet" href="../CSS/login.css" />
</head>

<body>

    <div class="blob blob-top"></div>
    <div class="blob blob-bottom"></div>

    <form class="card login-card" id="loginForm">

        <h1 class="brand"><span>Smart</span>Queue</h1>
        <p class="login-subtitle">Gestiona tu turno de forma rápida y sencilla</p>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tu@email.com" autocomplete="email" />
            <span class="error-msg" id="email-error" style="display:none;">Ingresa un email válido</span>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
            <span class="error-msg" id="pass-error" style="display:none;">La contraseña es requerida</span>
        </div>

        <span class="error-msg" id="api-error" style="text-align:center; display:none;"></span>

        <!-- 🔥 ESTE ES EL CAMBIO IMPORTANTE -->
        <<button type="submit" class="btn btn-primary" id="login-btn">
            <span id="btn-text">Iniciar sesión</span>
            <span id="spinner" style="display:none;">⏳</span>
            </button>

            <a class="forgot" href="#">¿Olvidaste tu contraseña?</a>

            <div class="divider"></div>

            <p class="register-link">¿No tienes cuenta? <a href="#">Regístrate</a></p>

    </form>

    <div class="toast" id="toast"></div>

    <script src="../JS/login.js"></script>

</body>

</html>
