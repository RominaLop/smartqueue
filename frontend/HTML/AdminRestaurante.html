<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartQueue - Administrador Restaurante</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #e8ead7;
      color: #2d2d2d;
      min-height: 100vh;
    }

    .app-container {
      max-width: 430px;
      margin: auto;
      min-height: 100vh;
      background: #f7f7f0;
      padding: 20px;
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .restaurant-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .restaurant-logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: #b8bc83;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: white;
      font-size: 20px;
    }

    .restaurant-info h2 {
      font-size: 18px;
      color: #333;
    }

    .restaurant-info p {
      font-size: 12px;
      color: #777;
    }

    .status-badge {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .open {
      background: #d8f3dc;
      color: #2d6a4f;
    }

    .closed {
      background: #ffd6d6;
      color: #a4161a;
    }

    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .switch-text p {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }

    .switch {
      position: relative;
      width: 54px;
      height: 28px;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 30px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #6b5b7b;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    label {
      font-size: 13px;
      color: #555;
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    input[type="time"],
    input[type="number"] {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: #f8f8f8;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .save-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 15px;
      background: #6b5b7b;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #594a67;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: #e8ead7;
      border-radius: 15px;
      padding: 14px 8px;
      text-align: center;
    }

    .stat-box h4 {
      font-size: 20px;
      color: #6b5b7b;
      margin-bottom: 5px;
    }

    .stat-box p {
      font-size: 11px;
      color: #555;
    }

    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f4f4ec;
      padding: 13px;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .client-info h4 {
      font-size: 14px;
      color: #333;
    }

    .client-info p {
      font-size: 12px;
      color: #777;
      margin-top: 3px;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      border: none;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }

    .call {
      background: #d8f3dc;
      color: #2d6a4f;
    }

    .done {
      background: #dbe7ff;
      color: #1d4ed8;
    }

    .cancel {
      background: #ffd6d6;
      color: #a4161a;
    }

    .next-client {
      background: #6b5b7b;
      color: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: center;
    }

    .next-client h3 {
      font-size: 15px;
      margin-bottom: 8px;
    }

    .next-client p {
      font-size: 13px;
      opacity: 0.9;
    }

    .bottom-nav {
      position: sticky;
      bottom: 0;
      background: #f7f7f0;
      padding: 12px 0 5px;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #ddd;
      margin-top: 20px;
    }

    .nav-item {
      text-align: center;
      font-size: 11px;
      color: #777;
    }

    .nav-item.active {
      color: #6b5b7b;
      font-weight: bold;
    }

    .empty-message {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 20px;
    }
  </style>
</head>

<body>
  <div class="app-container">

    <!-- HEADER -->
    <div class="header">
      <div class="restaurant-info">
        <div class="restaurant-logo">F</div>
        <div>
          <h2>FRED'S</h2>
          <p>Panel administrador</p>
        </div>
      </div>

      <span id="statusBadge" class="status-badge closed">Cerrado</span>
    </div>

    <!-- CONFIGURACIÓN -->
    <div class="card">
      <h3>Configuración de lista de espera</h3>

      <div class="switch-row">
        <div class="switch-text">
          <strong>Abrir lista de espera</strong>
          <p>Permite que los clientes se unan a la fila.</p>
        </div>

        <label class="switch">
          <input type="checkbox" id="restaurantSwitch">
          <span class="slider"></span>
        </label>
      </div>

      <label for="endTime">Hora de cierre de lista</label>
      <input type="time" id="endTime">

      <label for="maxClients">Máximo de clientes en espera</label>
      <input type="number" id="maxClients" placeholder="Ejemplo: 20">

      <button class="save-btn" onclick="saveSettings()">Guardar cambios</button>
    </div>

    <!-- ESTADÍSTICAS -->
    <div class="stats">
      <div class="stat-box">
        <h4 id="waitingCount">4</h4>
        <p>En espera</p>
      </div>

      <div class="stat-box">
        <h4 id="servedCount">0</h4>
        <p>Atendidos</p>
      </div>

      <div class="stat-box">
        <h4>15m</h4>
        <p>Tiempo prom.</p>
      </div>
    </div>

    <!-- SIGUIENTE CLIENTE -->
    <div class="next-client">
      <h3>Siguiente cliente</h3>
      <p id="nextClientText">Mesa para 2 - Juan Pérez</p>
    </div>

    <!-- LISTA DE ESPERA -->
    <div class="card">
      <h3>Lista de espera actual</h3>

      <div id="queueList"></div>
    </div>

    <!-- NAV -->
    <div class="bottom-nav">
      <div class="nav-item active">
        🏠
        <br>
        Inicio
      </div>
      <div class="nav-item">
        📋
        <br>
        Lista
      </div>
      <div class="nav-item">
        ⚙️
        <br>
        Ajustes
      </div>
    </div>

  </div>

  <script>
    let isOpen = false;
    let servedClients = 0;

    let queue = [
      {
        name: "Juan Pérez",
        people: 2,
        time: "10 min",
        status: "En espera"
      },
      {
        name: "María López",
        people: 4,
        time: "15 min",
        status: "En espera"
      },
      {
        name: "Carlos Ruiz",
        people: 3,
        time: "20 min",
        status: "En espera"
      },
      {
        name: "Ana Torres",
        people: 2,
        time: "25 min",
        status: "En espera"
      }
    ];

    const restaurantSwitch = document.getElementById("restaurantSwitch");
    const statusBadge = document.getElementById("statusBadge");
    const queueList = document.getElementById("queueList");
    const waitingCount = document.getElementById("waitingCount");
    const servedCount = document.getElementById("servedCount");
    const nextClientText = document.getElementById("nextClientText");

    restaurantSwitch.addEventListener("change", function () {
      isOpen = restaurantSwitch.checked;
      updateRestaurantStatus();
    });

    function updateRestaurantStatus() {
      if (isOpen) {
        statusBadge.textContent = "Abierto";
        statusBadge.className = "status-badge open";
      } else {
        statusBadge.textContent = "Cerrado";
        statusBadge.className = "status-badge closed";
      }
    }

    function renderQueue() {
      queueList.innerHTML = "";

      if (queue.length === 0) {
        queueList.innerHTML = `
          <p class="empty-message">No hay clientes en espera actualmente.</p>
        `;
        nextClientText.textContent = "No hay clientes en espera";
      } else {
        nextClientText.textContent = `Mesa para ${queue[0].people} - ${queue[0].name}`;
      }

      queue.forEach((client, index) => {
        const item = document.createElement("div");
        item.className = "queue-item";

        item.innerHTML = `
          <div class="client-info">
            <h4>${index + 1}. ${client.name}</h4>
            <p>Mesa para ${client.people} personas · Espera: ${client.time}</p>
          </div>

          <div class="actions">
            <button class="action-btn call" onclick="callClient(${index})">Llamar</button>
            <button class="action-btn done" onclick="serveClient(${index})">OK</button>
            <button class="action-btn cancel" onclick="cancelClient(${index})">X</button>
          </div>
        `;

        queueList.appendChild(item);
      });

      waitingCount.textContent = queue.length;
      servedCount.textContent = servedClients;
    }

    function callClient(index) {
      alert(`Llamando a ${queue[index].name}`);
    }

    function serveClient(index) {
      const clientName = queue[index].name;
      queue.splice(index, 1);
      servedClients++;
      alert(`${clientName} fue marcado como atendido.`);
      renderQueue();
    }

    function cancelClient(index) {
      const clientName = queue[index].name;
      const confirmCancel = confirm(`¿Seguro que deseas cancelar el turno de ${clientName}?`);

      if (confirmCancel) {
        queue.splice(index, 1);
        renderQueue();
      }
    }

    function saveSettings() {
      const endTime = document.getElementById("endTime").value;
      const maxClients = document.getElementById("maxClients").value;

      if (!endTime) {
        alert("Por favor selecciona la hora de cierre de la lista.");
        return;
      }

      if (!maxClients || maxClients <= 0) {
        alert("Por favor ingresa un número válido de clientes.");
        return;
      }

      alert(
        `Configuración guardada:\n` +
        `Estado: ${isOpen ? "Abierto" : "Cerrado"}\n` +
        `Hora de cierre: ${endTime}\n` +
        `Máximo de clientes: ${maxClients}`
      );
    }

    renderQueue();
    updateRestaurantStatus();
  </script>
</body>
</html>
